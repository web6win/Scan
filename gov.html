<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <script>
    (function () {
      var RTL = { ar: 1, ur: 1 };
      try {
        var l = localStorage.getItem("web6.lang");
        if (!l) return;
        document.documentElement.lang = l;
        if (RTL[l]) document.documentElement.dir = "rtl";
      } catch (e) { /* 私密模式下 localStorage 不可用，保持預設 */ }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>WEB6 区块链浏览器 · 验证人治理</title>
  <meta name="description" content="WEB6 联盟链验证人申请与审核治理" />
  <link rel="preconnect" href="https://chain.web6.win" crossorigin />
  <link rel="dns-prefetch" href="https://chain.web6.win" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f6df6'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif'>&#9672;</text></svg>" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <!-- 治理页需要 ABI 编解码（读 getValidators / 写投票交易），依赖 ethers；
       经典脚本先于模块脚本执行，挂载 window.ethers（同 address.html）。 -->
  <script src="assets/vendor/ethers.umd.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#view" data-i18n="a11y.skip">跳到主要内容</a>
  <header class="topbar" id="topbar"></header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="footer" id="footer"></footer>

  <nav class="tabbar" id="tabbar"></nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import { setupChrome } from "./assets/js/chrome.js";
    import { viewGovernance } from "./assets/js/views.js";
    setupChrome("gov", viewGovernance);
  </script>
  <noscript>
    <p class="noscript">WEB6 區塊鏈瀏覽器需要 JavaScript 才能載入鏈上資料，請開啟 JavaScript 後重新整理。</p>
  </noscript>
</body>
</html>
