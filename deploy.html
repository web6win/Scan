<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <!-- 首屏前先定好 <html lang> 與 dir：module script 是延遲執行的，
       等到它跑起來才切 dir，阿拉伯語／烏爾都語使用者會先看到一幀 LTR 版面才翻正。 -->
  <script>
    (function () {
      var RTL = { ar: 1, ur: 1 };
      try {
        var l = localStorage.getItem("web6.lang");
        if (!l) return;
        document.documentElement.lang = l;
        if (RTL[l]) document.documentElement.dir = "rtl";
      } catch (e) { /* 私密模式下 localStorage 不可用，保持預設 */ }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>WEB6 Blockchain Explorer · Deploy</title>
  <meta name="description" content="WEB6 consortium chain — upload Solidity source, compile in the browser, sign and deploy with your wallet" />
  <!-- 社群分享卡：連結在 IM / 社群被轉發時顯示正確標題與摘要 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="WEB6 Explorer" />
  <meta property="og:title" content="WEB6 Blockchain Explorer · Deploy" />
  <meta property="og:description" content="WEB6 consortium chain — upload Solidity source, compile in the browser, sign and deploy with your wallet" />
  <meta property="og:locale" content="zh_CN" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="WEB6 Blockchain Explorer · Deploy" />
  <meta name="twitter:description" content="WEB6 consortium chain — upload Solidity source, compile in the browser, sign and deploy with your wallet" />
  <!-- 全站資料都來自此 RPC 節點，預先建連可省掉一次 DNS + TLS 握手 -->
  <link rel="preconnect" href="https://chain.web6.win" crossorigin />
  <link rel="dns-prefetch" href="https://chain.web6.win" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f6df6'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='sans-serif'>&#9672;</text></svg>" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <!-- 鍵盤 / 螢幕閱讀器：第一個可聚焦元素，可直接跳過頂欄 -->
  <a class="skip-link" href="#view" data-i18n="a11y.skip">跳到主要内容</a>
  <header class="topbar" id="topbar"></header>

  <main id="view" class="view" tabindex="-1">
    <div class="container">
      <div class="page-title">
        <h1 data-i18n="dep.title">合约部署</h1>
      </div>

      <div class="deploy-warn" data-i18n-html="dep.warn"></div>

      <!-- ① 原始碼上傳 + 編譯：全程在瀏覽器裡跑，原始碼不上傳任何伺服器 -->
      <div class="panel">
        <div class="panel-head">
          <h2 data-i18n="dep.stepSource">① 上传源代码</h2>
        </div>
        <div class="kv deploy-form">
          <div id="dropzone" class="dropzone" role="button" tabindex="0">
            <span class="dz-icon" aria-hidden="true">📄</span>
            <span class="dz-main" data-i18n="dep.dropzone">点击选择，或把 .sol 文件拖到这里</span>
            <span class="hint" data-i18n="dep.dropzoneHint">可多选；被 import 的文件请一并上传</span>
            <input id="solFiles" type="file" accept=".sol,.json,.txt" multiple hidden />
          </div>

          <!-- 偵測到 @openzeppelin 之類的裸套件 import 時，這裡會列出庫與版本 -->
          <div id="libPicker" class="lib-picker" hidden></div>

          <div id="fileList" class="file-list"></div>

          <div class="field-row">
            <div class="field">
              <label for="solcVer" data-i18n="dep.compilerVer">编译器版本 (solc)</label>
              <select id="solcVer"></select>
            </div>
            <div class="field">
              <label for="optimize" data-i18n="code.optimize">启用优化</label>
              <input id="optimize" type="checkbox" checked />
            </div>
            <div class="field">
              <label for="optRuns" data-i18n="dep.optimizeRuns">优化次数 (runs)</label>
              <input id="optRuns" type="number" min="1" step="1" value="200" />
            </div>
            <div class="field">
              <label for="evmVersion" data-i18n="code.evmVersion">EVM 版本</label>
              <select id="evmVersion"></select>
            </div>
          </div>

          <button id="compileBtn" class="btn" type="button" data-i18n="dep.compileBtn">🔨 编译</button>
          <div id="compileOut"></div>
        </div>
      </div>

      <!-- ② 簽名方式：錢包插件（私鑰不出錢包）或本地私鑰 -->
      <div class="panel">
        <div class="panel-head">
          <h2 data-i18n="dep.stepSign">② 签名方式</h2>
        </div>
        <div class="kv deploy-form">
          <div class="field">
            <label for="signMode" data-i18n="dep.signMode">签名方式</label>
            <select id="signMode">
              <option value="wallet" data-i18n="dep.signWallet">浏览器钱包插件（推荐）</option>
              <option value="key" data-i18n="dep.signKey">私钥本地签名</option>
            </select>
          </div>

          <div id="walletBox" class="field">
            <button id="connectBtn" class="btn" type="button" data-i18n="dep.connectWallet">连接钱包</button>
            <div id="walletState" class="hint"></div>
            <button id="switchNetBtn" class="btn btn-ghost btn-sm" type="button" data-i18n="dep.switchNetwork" hidden>切换 / 添加网络</button>
          </div>

          <div id="keyBox" hidden>
            <div class="field">
              <label for="privKey" data-i18n="dep.privKey">私钥（Private Key）</label>
              <textarea id="privKey" rows="2" spellcheck="false" data-i18n-ph="dep.privKeyPh"></textarea>
              <div class="hint" data-i18n="dep.privKeyHint"></div>
            </div>
            <button id="genWallet" class="btn" type="button" data-i18n="dep.genWallet">🎲 生成新钱包</button>
          </div>
        </div>
      </div>

      <!-- ③ 部署參數：bytecode / 構造函數參數 / gas（編譯後會自動帶入前兩項） -->
      <div class="panel">
        <div class="panel-head">
          <h2 data-i18n="dep.stepParams">③ 部署参数</h2>
        </div>
        <div class="kv deploy-form">
          <div class="field">
            <label for="bytecode" data-i18n="dep.bytecode">合约字节码（Bytecode）</label>
            <textarea id="bytecode" rows="6" spellcheck="false" data-i18n-ph="dep.bytecodePh"></textarea>
            <div class="hint" data-i18n="dep.bytecodeHint"></div>
            <div id="bytecodeAuto" class="hint auto-fill" hidden></div>
          </div>

          <div class="field">
            <label for="ctorMode" data-i18n="dep.ctorMode">构造函数参数</label>
            <select id="ctorMode">
              <option value="none" data-i18n="dep.ctorNone">无</option>
              <option value="hex" data-i18n="dep.ctorHex">附加 ABI 编码的 Hex</option>
              <option value="abi" data-i18n="dep.ctorAbi">通过 ABI 自动编码</option>
            </select>
          </div>

          <div class="field" id="ctorHexField" hidden>
            <label for="ctorHex" data-i18n="dep.ctorHexLabel">构造函数参数 Hex（ABI 编码）</label>
            <input id="ctorHex" spellcheck="false" placeholder="0x…" />
          </div>

          <div class="field" id="ctorAbiField" hidden>
            <label for="ctorAbi" data-i18n="dep.ctorAbiLabel">合约 ABI（JSON）</label>
            <textarea id="ctorAbi" rows="3" spellcheck="false" placeholder='[{"inputs":[{"name":"x","type":"uint256"}],"type":"constructor"}]'></textarea>
            <label for="ctorArgs" data-i18n="dep.ctorArgsLabel">构造函数参数（JSON 数组）</label>
            <input id="ctorArgs" spellcheck="false" placeholder="[123]" />
          </div>

          <!-- 編譯成功後把構造函數的每一個參數拆成獨立輸入框，不必手寫 JSON -->
          <div id="ctorFields" class="field" hidden></div>

          <div class="field">
            <label for="gasMode" data-i18n="dep.gasMode">Gas 上限</label>
            <select id="gasMode">
              <option value="auto" data-i18n="dep.gasAuto">自动估算（含 20% 余量）</option>
              <option value="manual" data-i18n="dep.gasManual">手动设置</option>
            </select>
            <input id="gasLimit" type="number" min="21000" step="1000" placeholder="3000000" hidden />
          </div>

          <div class="field">
            <label for="priceMode" data-i18n="dep.priceMode">Gas 价格（Gwei）</label>
            <select id="priceMode">
              <option value="auto" data-i18n="dep.priceAuto">自动（节点建议）</option>
              <option value="manual" data-i18n="dep.priceManual">手动设置</option>
            </select>
            <input id="gasPrice" type="number" min="0" step="any" placeholder="1" hidden />
          </div>

          <button id="deployBtn" class="deploy-submit" type="button" data-i18n="dep.submit">🚀 部署合约</button>
        </div>
      </div>

      <!-- ④ 把 ABI / 原始碼發布到驗證服務（可選）：要填管理員金鑰才會動 -->
      <div class="panel">
        <div class="panel-head">
          <h2 data-i18n="dep.stepPublish">④ 发布验证信息（可选）</h2>
        </div>
        <div class="kv deploy-form">
          <div class="hint" data-i18n="dep.publishHint"></div>
          <div class="field">
            <label for="apiBase" data-i18n="dep.publishApi">验证服务地址</label>
            <input id="apiBase" type="url" spellcheck="false" placeholder="https://verify.example.com" />
          </div>
          <div class="field">
            <label for="apiKey" data-i18n="dep.publishKey">管理员密钥（X-Api-Key）</label>
            <input id="apiKey" type="password" spellcheck="false" autocomplete="off" />
          </div>
          <button id="publishBtn" class="btn btn-ghost" type="button" data-i18n="dep.publishBtn">发布到验证服务</button>
          <div id="publishState" class="hint"></div>
        </div>
      </div>

      <div id="deployResult"></div>
    </div>
  </main>

  <footer class="footer" id="footer"></footer>

  <nav class="tabbar" id="tabbar"></nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module">
    import { setupChrome } from "./assets/js/chrome.js";
    import { initDeploy } from "./assets/js/deploy.js";
    setupChrome("deploy", initDeploy);
  </script>
  <noscript>
    <p class="noscript">WEB6 區塊鏈瀏覽器需要 JavaScript 才能載入鏈上資料，請開啟 JavaScript 後重新整理。</p>
  </noscript>
</body>
</html>
